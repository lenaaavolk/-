animation:float 6s ease-in-out infinite}.wave{display:flex;gap:7px;align-items:center;height:60px}.wave i{width:4px;border-radius:5px;background:#d2dfff;height:20px;animation:wave 1.2s ease-in-out infinite alternate;animation-play-state:paused}.playing .wave i{animation-play-state:running}.wave i:nth-child(2n){height:47px;animation-delay:-.4s}.wave i:nth-child(3n){height:34px;animation-delay:-.8s}h1{font-size:32px;line-height:1.2;margin:5px 0 8px;letter-spacing:-1px}.artist{color:var(--muted);margin:0 0 25px}.seek{width:100%;accent-color:var(--accent);cursor:pointer;height:18px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;justify-content:center;gap:26px;margin:25px 0}.icon{border:0;background:transparent;width:46px;height:46px;display:grid;place-items:center}.icon svg{width:23px;height:23px;fill:currentColor}.play{width:66px;height:66px;border-radius:50%;background:#dbe5ff;color:#15223f;box-shadow:0 0 30px #9cbaff22}.play:hover{background:white}.tracking{border-top:1px solid var(--line);padding-top:20px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px}.tracking small{display:block;color:var(--muted);font-size:12px}.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff15;transition:background .4s}.dots i.on{background:var(--accent);box-shadow:0 0 10px #9cbaff55}.playlist{padding:27px 20px}.listhead{padding:0 12px 22px;display:flex;justify-content:space-between;align-items:center}h2{font-size:21px;margin:0;font-weight:600;letter-spacing:-.5px}.count{font-size:13px;color:var(--muted)}ol{margin:0;padding:0;list-style:none}.track{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid transparent;border-radius:13px;background:transparent;padding:14px 12px}.track.active{background:#9cbaff10;border-color:#9cbaff25}.number{font-size:12px;color:#8e9dbb;font-variant-numeric:tabular-nums}.track.active .number{color:var(--accent)}.title{display:block;font-size:15px;font-weight:550}.by{display:block;color:var(--muted);font-size:12px;margin-top:2px}.mood{font-size:12px;color:#acc2f4;white-space:nowrap}.mood.neutral{color:#c5c6d1}.mood.happy{color:#bde6b8}.legend{border-top:1px solid var(--line);margin:18px 12px 0;padding-top:18px;display:flex;gap:17px;color:var(--muted);font-size:12px}footer{margin-top:24px;display:flex;justify-content:space-between;gap:20px;color:#8d98b0;font-size:12px}#status{min-height:18px}.notice{max-width:420px;width:calc(100% - 32px);padding:32px;color:#f1f4ff;background:#172136ed;border:1px solid #ffffff30;border-radius:24px;box-shadow:0 30px 120px #0009;backdrop-filter:blur(30px)}.notice::backdrop{background:#03071399;backdrop-filter:blur(8px)}.notice[open]{animation:appear .3s ease-out}.notice h2{font-size:26px;margin:14px 0}.notice p{color:#bbc5d9}.actions{display:flex;gap:10px;margin-top:26px}.actions button{flex:1;border:1px solid #ffffff22;border-radius:12px;padding:12px;background:transparent}.actions .yes{background:#dbe5ff;color:#15223f}.note{font-size:12px}.notice .symbol{font-size:28px;color:#bed1ff}@keyframes float{50%{transform:translateY(-9px)}}@keyframes ambient{to{opacity:.6;transform:scale(1.06)}}@keyframes wave{to{transform:scaleY(.4)}}@keyframes appear{from{opacity:0;transform:translateY(15px)}}@media(max-width:760px){.shell{padding:25px 16px}header{margin-bottom:24px}.session{font-size:12px}main{grid-template-columns:1fr}.player{padding:25px}.visual{height:235px}footer{flex-direction:column;gap:4px}.legend{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
/* Палитры настроения. Синий вариант сохраняет исходный вид. */
body{--accent:#9cbaff;--track-color:#293b60;--theme-rgb:156,186,255;--surface:#080d19;--glow-a:#243c7260;--glow-b:#4b286747;--orb-top:#d4e2ff66;--orb-bottom:#6571e566;--button:#dbe5ff;--ink:#15223f;background:var(--surface);transition:background 1s ease,color .6s ease}
body[data-mood="neutral"]{--accent:#8bd9cd;--track-color:#244c4c;--theme-rgb:139,217,205;--surface:#091716;--glow-a:#205f5960;--glow-b:#24455247;--orb-top:#c7fff166;--orb-bottom:#42a59b66;--button:#c7eee6;--ink:#173b35;--muted:#a2bdb8}
body[data-mood="happy"]{--accent:#ffc582;--track-color:#60442d;--theme-rgb:255,197,130;--surface:#1a100e;--glow-a:#92502560;--glow-b:#71324d47;--orb-top:#fff0c866;--orb-bottom:#e77c5266;--button:#ffe0b5;--ink:#4a2b19;--muted:#c8afa0}
body:before{background:none}
/* Два дополнительных световых слоя обеспечивают плавную смену фона. */
.shell:before,.shell:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;transition:opacity 1s ease}
.shell:before{background:radial-gradient(ellipse at 18% 32%,#205f5960,transparent 52%),radial-gradient(ellipse at 92% 78%,#24455247,transparent 50%);opacity:0}
.shell:after{background:radial-gradient(ellipse at 18% 32%,#92502560,transparent 52%),radial-gradient(ellipse at 92% 78%,#71324d47,transparent 50%);opacity:0}
body:before{background:radial-gradient(ellipse at 18% 32%,#243c7260,transparent 52%),radial-gradient(ellipse at 92% 78%,#4b286747,transparent 50%);transition:opacity 1s ease;animation:none}
body[data-mood="neutral"]:before,body[data-mood="happy"]:before{opacity:0}
body[data-mood="neutral"] .shell:before,body[data-mood="happy"] .shell:after{opacity:1}
.orb{background:radial-gradient(circle at 30% 26%,var(--orb-top),transparent 40%),radial-gradient(circle at 65% 75%,var(--orb-bottom),transparent 60%),rgba(var(--theme-rgb),.09);border-color:rgba(var(--theme-rgb),.27);box-shadow:inset -15px -15px 45px #0003,inset 4px 4px 20px #ffffff22,0 0 70px rgba(var(--theme-rgb),.14);transition:background .8s,border-color .8s,box-shadow .8s}
.wave i{background:var(--button);transition:background .8s}
.tag{color:var(--accent);border:0;background:transparent;padding-right:0}
.play,.actions .yes{background:var(--button);color:var(--ink);box-shadow:0 0 30px rgba(var(--theme-rgb),.13)}
.play:hover{background:var(--accent)}
.track.active{background:rgba(var(--theme-rgb),.06);border-color:rgba(var(--theme-rgb),.15)}
/* Номера следуют палитре плеера; mood каждого трека — его собственной категории. */
.number{color:rgba(var(--theme-rgb),.7);transition:color .6s ease}
.track.active .number{color:var(--accent)}
.mood{color:#9cbaff}.mood.neutral{color:#8bd9cd}.mood.happy{color:#ffc582}
#previous,#next{color:#fff}
.dots i.on{box-shadow:0 0 10px rgba(var(--theme-rgb),.33)}
.notice{background:var(--surface)}.notice p{color:var(--muted)}.notice .symbol{color:var(--accent)}
.seek::-webkit-slider-runnable-track{transition:background .8s}
/* Холодный синий трек вместо стандартной серой полосы браузера. */
.seek{appearance:none;-webkit-appearance:none;background:transparent;--progress:0%}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress),var(--track-color) var(--progress),var(--track-color) 100%)}
.seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border:0;border-radius:50%;background:var(--accent)}
.seek::-moz-range-track{height:4px;border-radius:999px;background:var(--track-color)}
.seek::-moz-range-progress{height:4px;border-radius:999px;background:var(--accent)}
.seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}
/* Высота карточек ограничена окном; прокручивается только список треков.
   На низких экранах сначала уменьшаются декор и свободные отступы. */
html,body{height:100%;overflow:hidden}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,3vh,32px) 30px;gap:clamp(10px,2vh,22px)}
header{flex:none;margin:0}
main{flex:1;min-height:0;min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.player{min-height:0;min-width:0;display:flex;flex-direction:column;padding:clamp(16px,3vh,30px) clamp(12px,3vw,32px)}
.topline,h1,.artist,.seek,.times,.controls,.tracking{flex-shrink:0}
/* Свечение выходит за область круга без прямоугольной обрезки. */
.visual{flex:1;min-height:0;min-width:0;width:100%;height:auto;padding:0;container-type:size;overflow:visible;pointer-events:none}
/* Размер круга зависит от свободной области, а не от высоты карточки.
   Запас 24px сохраняет расстояние до текста даже во время анимации. */
.orb{position:absolute;width:max(0px,min(196px,calc(100cqh - 24px),calc(100cqw - 24px)));height:auto;min-height:0;max-width:196px;aspect-ratio:1}
@container(max-height:48px){.orb{display:none}}
@container(max-width:48px){.orb{display:none}}
h1,.artist{max-width:100%;overflow-wrap:anywhere}
.topline{gap:8px;flex-wrap:wrap}
/* Все размеры волн заданы относительно круга: рисунок масштабируется целиком. */
.wave{width:36%;height:31%;max-height:100%;gap:0;justify-content:space-between;overflow:hidden}
.wave i{width:5.7%;height:33.33%;flex-shrink:0;border-radius:999px}
.wave i:nth-child(2n){height:78.33%}
.wave i:nth-child(3n){height:56.67%}
.artist{margin-bottom:clamp(8px,2vh,25px)}
.controls{margin:clamp(10px,2.5vh,25px) 0}
.tracking{border-top:0;padding-top:clamp(10px,2vh,20px)}
.playlist{min-height:0;min-width:0;display:flex;flex-direction:column;padding:22px 16px}
.listhead,.legend{flex-shrink:0}
/* Номер и mood выравниваются по базовой линии названия, а не двух строк. */
.track{align-items:baseline}
.legend{border-top:0}
#tracks{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(var(--theme-rgb),.33) transparent;scrollbar-gutter:stable;padding:5px}
#tracks::-webkit-scrollbar{width:6px}
#tracks::-webkit-scrollbar-thumb{background:rgba(var(--theme-rgb),.33);border-radius:6px}
/* Статус доступен скринридерам, но больше не занимает место под карточками. */
footer{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.notice{max-height:calc(100dvh - 32px);overflow-y:auto}
.notice h2{margin:4px 44px 14px 0}
.notice p{margin:0;line-height:1.65}
.notice .actions{margin-top:36px}
.notice-close{position:absolute;top:37px;right:32px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:#ffffff08;color:var(--muted)}
.notice-close:focus,.notice-close:focus-visible{outline:none}
.notice-close:focus-visible{background:#ffffff13;color:#fff}
.notice-close:hover{color:#fff;background:#ffffff13}
.notice-close svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
/* Состояния попапа используют акцент текущей палитры. */
.notice-close,.notice .actions button{transition:background .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.notice-close:hover{background:rgba(var(--theme-rgb),.18);color:#fff}
.notice-close:active{background:rgba(var(--theme-rgb),.3);transform:scale(.9);box-shadow:inset 0 2px 5px #0003}
.notice .actions button:hover{background:rgba(var(--theme-rgb),.12);border-color:rgba(var(--theme-rgb),.5);transform:translateY(-1px)}
.notice .actions button:active{background:rgba(var(--theme-rgb),.22);transform:translateY(1px) scale(.98);box-shadow:inset 0 2px 6px #0003}
.notice .actions .yes:hover{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 20px rgba(var(--theme-rgb),.25)}
.notice .actions .yes:active{background:var(--accent);box-shadow:inset 0 3px 8px #0003}
@media(max-width:760px){
 .shell{padding:12px 16px;gap:10px}
 header{margin:0}.session{font-size:12px}
 main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(280px,1.2fr) minmax(120px,1fr);gap:12px}
 .player{padding:14px 20px}.visual{padding:0}
 h1{font-size:26px}.artist{margin-bottom:8px;font-size:14px}
 .controls{margin:8px 0}.play{width:50px;height:50px}
 .tracking{padding-top:8px}.playlist{padding:12px}
 .listhead{padding-bottom:8px}.legend{margin-top:8px;padding-top:8px;gap:8px}
 footer{font-size:12px}
}
/* При экстремально малой высоте оставляем доступ к управлению через скролл. */
@media(max-height:480px){
 html,body{height:auto;overflow:auto}
 .shell{height:auto;min-height:100dvh}
 main{flex:none;min-height:380px}
 .playlist{max-height:380px}
 .visual{display:none}
}
</style>
</head>
<body>
<div class="shell"><header><div class="brand">M<span>◦</span>OD</div><div class="session">Твой звук — твоё состояние</div></header>
<main><section class="player glass" aria-label="Аудиоплеер"><div class="topline"><span class="eyebrow">Сейчас звучит</span><span class="tag" id="category"></span></div><div class="visual" aria-hidden="true"><div class="orb"><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><h1 id="title"></h1><p class="artist" id="artist"></p><input class="seek" id="seek" type="range" min="0" max="32" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="times"><span id="elapsed">0:00</span><span>0:32</span></div><div class="controls"><button class="icon" id="previous" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zm14 0v14L9 12z"/></svg></button><button class="icon play" id="play" aria-label="Воспроизвести"></button><button class="icon" id="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM5 5l10 7-10 7z"/></svg></button></div><div class="tracking"><div><small id="streak">Грустных подряд: 0 из 5</small></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div></section>
<section class="playlist glass" aria-label="Плейлист"><div class="listhead"><h2>На твоей волне</h2><span class="count">8 треков &nbsp; 4:16</span></div><ol id="tracks"></ol><div class="legend"><span>☾ Грустный &lt; 40</span><span>◦ Нейтральный 40–70</span><span>☀ Бодрый &gt; 70</span></div></section></main>
<footer><span id="status" role="status" aria-live="polite"></span></footer></div>
<dialog class="notice" id="notice" aria-labelledby="noticeTitle" aria-describedby="noticeText"><button class="notice-close" id="closeNotice" aria-label="Закрыть уведомление"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><h2 id="noticeTitle">Сменим вайб?</h2><p id="noticeText">Ты послушал 5 грустных подряд. Предлагаю включить что-то бодрое</p><div class="actions"><button class="yes" id="yes">Да, хочу</button><button id="no">Нет, оставь</button></div></dialog>
<audio id="audio" preload="auto"></audio>
<script>
'use strict';
// Ровно 8 треков. Первые пять позволяют последовательно проверить уведомление.
const tracks = [
 {title:'После дождя',artist:'MOOD Studio · piano',mood:22,root:220},
 {title:'Тихие улицы',artist:'MOOD Studio · ambient',mood:18,root:196},
 {title:'Неотправленное',artist:'MOOD Studio · keys',mood:31,root:246.94},
 {title:'Между нами',artist:'MOOD Studio · slow waves',mood:27,root:174.61},
 {title:'Последний свет',artist:'MOOD Studio · nocturne',mood:35,root:164.81},
 {title:'В своём ритме',artist:'MOOD Studio · chill',mood:56,root:261.63},
 {title:'Навстречу солнцу',artist:'MOOD Studio · bright keys',mood:86,root:293.66},
 {title:'Новый день',artist:'MOOD Studio · upbeat',mood:94,root:329.63}
];
const $=id=>document.getElementById(id), audio=$('audio');
const state={index:0,streak:0,counted:false,declines:0};
// Новая версия счётчика: прежняя ошибочно учитывала крестик как отказ.
// Старое отключение не переносим; новые явные отказы сохраняем в сессии.
const storageKey='mood-player.explicit-declines.v2';
// В закрытых режимах storage может быть недоступен: сохраняем работу в памяти.
try{state.declines=Math.max(0,Number(sessionStorage.getItem(storageKey))||0)}catch(e){}
const category=m=>m<40?'sad':m<=70?'neutral':'happy';
const labels={sad:'Грустный',neutral:'Нейтральный',happy:'Бодрый'};
const symbols={sad:'☾',neutral:'◦',happy:'☀'};
const urls=new Map();
// Создаём настоящий WAV в памяти. Весь звук самодостаточен, без сетевых запросов.
// Мелодии различаются тональностью, темпом и минорным/мажорным ладом.
function trackUrl(index){
 if(urls.has(index))return urls.get(index);
 const track=tracks[index],rate=16000,duration=32,length=rate*duration;
 const buffer=new ArrayBuffer(44+length*2),view=new DataView(buffer);
 const write=(offset,text)=>{for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))};
 write(0,'RIFF');view.setUint32(4,36+length*2,true);write(8,'WAVE');write(12,'fmt ');
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
 view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,length*2,true);
 const happy=track.mood>70,scale=track.mood<40?[0,3,7,10,7,3,5,2]:[0,4,7,12,7,9,4,2],beat=happy?.3:.6;
 for(let i=0;i<length;i++){
  const t=i/rate,n=Math.floor(t/beat),local=t%beat,f=track.root*2**(scale[(n+index)%scale.length]/12);
  const envelope=Math.min(1,local/.015)*Math.exp(-local*6);
  const melody=(Math.sin(2*Math.PI*f*t)+.18*Math.sin(4*Math.PI*f*t))*.19*envelope;
  const pad=(Math.sin(Math.PI*track.root*t)+Math.sin(Math.PI*track.root*2**(7/12)*t))*.045;
  const pulse=happy?Math.sin(2*Math.PI*70*(t%beat))*.07*Math.exp(-(t%beat)*25):0;
  const fade=Math.min(1,t/.1,(duration-t)/.4);
  view.setInt16(44+i*2,Math.max(-1,Math.min(1,(melody+pad+pulse)*fade))*32767,true);
 }
 const url=URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));urls.set(index,url);return url;
}
function render(){
 const track=tracks[state.index],kind=category(track.mood);
 document.body.dataset.mood=kind;
 $('title').textContent=track.title;$('artist').textContent=track.artist;
 $('category').textContent=`${symbols[kind]} ${labels[kind]} · ${track.mood}`;
 document.querySelectorAll('.track').forEach((button,i)=>{button.classList.toggle('active',i===state.index);button.setAttribute('aria-current',String(i===state.index))});
 $('streak').textContent=`Грустных подряд: ${state.streak}`;
 const progress=state.streak===0?0:((state.streak-1)%5)+1;
 document.querySelectorAll('.dots i').forEach((dot,i)=>dot.classList.toggle('on',i<progress));
}
function renderPlayback(){
 const playing=!audio.paused;document.body.classList.toggle('playing',playing);
 $('play').setAttribute('aria-label',playing?'Пауза':'Воспроизвести');
 $('play').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${playing?'M6 4h4v16H6zm8 0h4v16h-4z':'M8 4l12 8-12 8z'}"/></svg>`;
}
// Считаем только начавшееся воспроизведение, один раз на выбор трека.
// Пауза, возобновление и перемотка не увеличивают счётчик.
audio.addEventListener('playing',()=>{
 if(!state.counted){state.counted=true;state.streak=tracks[state.index].mood<40?state.streak+1:0;render();
  // Предлагаем смену настроения строго на 5, 10, 15… треках серии.
  if(state.streak>0&&state.streak%5===0&&state.declines<3&&!$('notice').open){
   $('noticeText').textContent=`Ты послушал ${state.streak} грустных подряд. Предлагаю включить что-то бодрое`;
   $('notice').showModal();
  }
 }
 renderPlayback();
});
async function play(){try{await audio.play();$('status').textContent='Музыка в твоём ритме'}catch(e){if(e.name!=='AbortError')$('status').textContent='Не удалось включить звук. Нажми Play ещё раз.'}}
function select(index,autoplay=true){
 audio.pause();state.index=(index+tracks.length)%tracks.length;state.counted=false;
 audio.src=trackUrl(state.index);$('seek').value=0;updateSeekFill();$('elapsed').textContent='0:00';render();renderPlayback();if(autoplay)play();
}
tracks.forEach((track,i)=>{
 const li=document.createElement('li'),button=document.createElement('button'),kind=category(track.mood);
 button.className='track';button.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span><span class="title">${track.title}</span><span class="by">${track.artist}</span></span><span class="mood ${kind}">${symbols[kind]} ${track.mood}</span>`;
 button.setAttribute('aria-label',`${track.title}, ${track.artist}, ${labels[kind]}, mood ${track.mood}`);
 button.onclick=()=>i===state.index?(audio.paused?play():audio.pause()):select(i);
 li.append(button);$('tracks').append(li);
});
$('play').onclick=()=>audio.paused?play():audio.pause();
$('next').onclick=()=>select(state.index+1);$('previous').onclick=()=>select(state.index-1);
audio.addEventListener('pause',renderPlayback);audio.addEventListener('ended',()=>select(state.index+1));
audio.addEventListener('error',()=>{$('status').textContent='Ошибка воспроизведения. Попробуй другой трек.';renderPlayback()});
const time=seconds=>`${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
function updateSeekFill(){$('seek').style.setProperty('--progress',`${Number($('seek').value)/Number($('seek').max)*100}%`)}
audio.addEventListener('timeupdate',()=>{$('seek').value=audio.currentTime;updateSeekFill();$('elapsed').textContent=time(audio.currentTime)});
$('seek').oninput=()=>{updateSeekFill();if(Number.isFinite(audio.duration))audio.currentTime=Number($('seek').value)};
// После третьего отказа запрет сохраняется при перезагрузке в этой вкладке.
function decline(){
 // Отказ сохраняет серию: следующее предложение — через пять треков.
 $('notice').close();state.declines++;
 try{sessionStorage.setItem(storageKey,String(state.declines))}catch(e){}
 $('status').textContent=state.declines>=3?'Предложения отключены до конца сессии':'Остаёмся в твоём настроении';render();
}
$('no').onclick=decline;
// Закрытие не является отказом и не отключает будущие предложения.
function dismissNotice(){$('notice').close()}
$('closeNotice').onclick=dismissNotice;
$('notice').addEventListener('cancel',event=>{event.preventDefault();dismissNotice()});
$('yes').onclick=()=>{
 $('notice').close();state.streak=0;
 const upbeat=tracks.map((t,i)=>t.mood>70?i:-1).filter(i=>i>=0);
 select(upbeat[Math.floor(Math.random()*upbeat.length)]);
};
select(0,false);
</script>
</body></html>
